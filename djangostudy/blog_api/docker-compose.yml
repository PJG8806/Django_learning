# 환경 변수는 자동으로 .env에서 불러옴
services:
  db:
    image: postgres:16 # 포스트그레 16 이미지
    restart: always # 꺼지더라도 "항상" 재시작한다.
    environment:
      POSTGRES_DB: ${POSTGRES_DB} # .env꺼 가져온다
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 55432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
